server:
  port: 8080
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 200
    connection-timeout: 5000

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    druid:
      driver-class-name: ${fashion.datasource.driver-class-name}
      url: jdbc:mysql://${fashion.datasource.host}:${fashion.datasource.port}/${fashion.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${fashion.datasource.username}
      password: ${fashion.datasource.password}
      initial-size: 20
      min-idle: 20
      max-active: 100
      max-wait: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  redis:
    host: ${fashion.redis.host}
    port: ${fashion.redis.port}
    password: ${fashion.redis.password}
    database: ${fashion.redis.database}
  rabbitmq:
    host: ${fashion.rabbitmq.host}
    port: ${fashion.rabbitmq.port}
    username: ${fashion.rabbitmq.username}
    password: ${fashion.rabbitmq.password}
    virtual-host: ${fashion.rabbitmq.virtual-host}
    connection-timeout: ${fashion.rabbitmq.connection-timeout:2s}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        concurrency: 5
        max-concurrency: 20
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fashion.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      fashion:
        mapper: info
        service: debug
        controller: debug

fashion:
  sentinel:
    seckill-qps: ${FASHION_SENTINEL_SECKILL_QPS:500}
  product-cache:
    list-physical-ttl: ${FASHION_PRODUCT_CACHE_LIST_TTL:15m}
    detail-logical-ttl: ${FASHION_PRODUCT_CACHE_DETAIL_LOGICAL_TTL:10m}
    detail-physical-ttl: ${FASHION_PRODUCT_CACHE_DETAIL_PHYSICAL_TTL:30m}
    empty-physical-ttl: ${FASHION_PRODUCT_CACHE_EMPTY_TTL:30s}
    actual-jitter: ${FASHION_PRODUCT_CACHE_ACTUAL_JITTER:2m}
    empty-jitter: ${FASHION_PRODUCT_CACHE_EMPTY_JITTER:10s}
    lock-ttl: ${FASHION_PRODUCT_CACHE_LOCK_TTL:10s}
  product-projection:
    max-attempts: ${FASHION_PRODUCT_PROJECTION_MAX_ATTEMPTS:8}
    batch-size: ${FASHION_PRODUCT_PROJECTION_BATCH_SIZE:20}
    reconcile-batch-size: ${FASHION_PRODUCT_RECONCILE_BATCH_SIZE:4}
    lease: ${FASHION_PRODUCT_PROJECTION_LEASE:30s}
    connect-timeout: ${FASHION_PRODUCT_ES_CONNECT_TIMEOUT:1s}
    socket-timeout: ${FASHION_PRODUCT_ES_SOCKET_TIMEOUT:3s}
    connection-request-timeout: ${FASHION_PRODUCT_ES_CONNECTION_REQUEST_TIMEOUT:1s}
    lease-margin: ${FASHION_PRODUCT_PROJECTION_LEASE_MARGIN:3s}
    retry-base: ${FASHION_PRODUCT_PROJECTION_RETRY_BASE:1s}
    retry-max: ${FASHION_PRODUCT_PROJECTION_RETRY_MAX:5m}
    retry-jitter: ${FASHION_PRODUCT_PROJECTION_RETRY_JITTER:1s}
    index-name: ${FASHION_PRODUCT_ES_INDEX:products}
    poll-delay: ${FASHION_PRODUCT_PROJECTION_POLL_DELAY_MS:1000}
    reconcile-poll-delay: ${FASHION_PRODUCT_RECONCILE_POLL_DELAY_MS:5000}
    reconcile-interval: ${FASHION_PRODUCT_RECONCILE_INTERVAL_MS:300000}
  agent:
    base-url: ${FASHION_AGENT_BASE_URL:}
    connect-timeout-ms: ${FASHION_AGENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${FASHION_AGENT_READ_TIMEOUT_MS:10000}
    internal-token: ${FASHION_AGENT_INTERNAL_TOKEN:}
    allow-insecure-http: ${FASHION_AGENT_ALLOW_INSECURE_HTTP:false}
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${FASHION_JWT_ADMIN_SECRET_KEY}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    #用户端接口
    user-secret-key: ${FASHION_JWT_USER_SECRET_KEY}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${fashion.alioss.endpoint}
    access-key-secret: ${fashion.alioss.access-key-secret}
    bucket-name: ${fashion.alioss.bucket-name}
    access-key-id: ${fashion.alioss.access-key-id}
  wechat:
    appid: ${fashion.wechat.appid}
    secret: ${fashion.wechat.secret}
    mch_id: ${fashion.wechat.mch_id}
    mch_serial_no: ${fashion.wechat.mch_serial_no}
    api-v3-key: ${fashion.wechat.api-v3-key}
    notify-url: ${fashion.wechat.notify-url}
    refund-notify-url: ${fashion.wechat.refund-notify-url}
  alipay:
    app-id: ${fashion.alipay.app-id}
    app-private-key: ${fashion.alipay.app-private-key}
    alipay-public-key: ${fashion.alipay.alipay-public-key}
    gateway-url: ${fashion.alipay.gateway-url}
    notify-url: ${fashion.alipay.notify-url}
    return-url: ${fashion.alipay.return-url}
